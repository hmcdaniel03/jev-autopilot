# CI for the public jev-autopilot repository (this file is a no-op while the plugin
# lives in a subfolder of another repo; GitHub only runs workflows from the root).
#
# No job needs an account or a secret: `claude plugin test` runs the tests in a child
# of the Claude Code binary with no session, sign-in or network. The type check needs
# the engine's generated declarations, which Claude Code writes when it loads the mod;
# running `/autopilot status` loads it without a sign-in because slash commands run
# locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - name: Validate the plugin manifest and hooks (warnings are errors)
        run: claude plugin validate --strict .
      - name: Validate the marketplace manifest
        run: claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Run the tests
        run: claude plugin test .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate the engine's type declarations by loading the mod once
        run: claude --plugin-dir . -p '/autopilot status'
      - name: Type-check hooks and tests
        run: |
          test -f .claude-plugin/types/tsconfig.json || { echo 'types were not generated'; exit 1; }
          npx -y -p typescript@5 tsc --noEmit -p .

# no-mistakes pipeline settings for jev-autopilot; see CONTRIBUTING.md.
# The daemon reads `commands` from the default branch only, so a pushed branch
# cannot change what its own gate runs.
commands:
  # The type check needs .claude-plugin/types/ (git-ignored), which Claude Code
  # writes when it loads the mod. Loading it under a throwaway HOME keeps the run
  # away from your own sign-in, secrets and autopilot state, and needs no account.
  prepare: >-
    h=$(mktemp -d) &&
    HOME="$h" claude --plugin-dir . -p '/autopilot status' >/dev/null;
    s=$?; rm -rf "$h";
    [ "$s" -eq 0 ] && test -f .claude-plugin/types/tsconfig.json
  # The same checks CI runs.
  test: >-
    claude plugin validate --strict . &&
    claude plugin validate --strict .claude-plugin/marketplace.json &&
    claude plugin test . &&
    npx -y -p typescript@5 tsc --noEmit -p .
